services:
  db:
    image: pgvector/pgvector:pg16
    container_name: msaidizi-db
    environment:
      POSTGRES_USER: msaidizi
      POSTGRES_PASSWORD: msaidizi
      POSTGRES_DB: msaidizi
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U msaidizi -d msaidizi"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
